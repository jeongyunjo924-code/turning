<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="only light" />
<meta name="theme-color" content="#FBF7F0" />
<title>도형 뒤집기 시뮬레이션</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: only light; }
  html, body {
    margin: 0; padding: 0;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    background: #FBF7F0;
    color: #2B2A28;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    padding: 12px 14px;
    padding:
      max(env(safe-area-inset-top), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-right), clamp(10px, 2vw, 20px))
      max(env(safe-area-inset-bottom), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-left), clamp(10px, 2vw, 20px));
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1100px;
    max-width: min(1100px, 100%);
    width: 100%;
    margin: 0 auto;
    height: 100%;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  .title {
    font-size: 20px;
    font-size: clamp(16px, 2.4vh, 24px);
    font-weight: 800; margin: 0; color: #1F4B3F; flex-shrink: 0;
  }
  .subtitle {
    margin: 2px 0 8px; color: #6B6459;
    font-size: 13px;
    font-size: clamp(11px, 1.4vh, 14px); flex-shrink: 0;
  }
  @media (max-width: 600px) { .subtitle { display: none; } }
  .btn {
    padding: 9px 14px; min-height: 38px;
    border-radius: 10px; border: 2px solid #DDD5C4;
    background: #fff; color: #2B2A28;
    font-weight: 700; font-size: 13px; font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.on-green { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn.on-orange { background: #C1622D; color: #fff; border-color: #C1622D; }
  .btn.done { background: #EEF5E0; border-color: #A8C66C; }
  .btn.pill { padding: 8px 14px; min-height: 36px; border-radius: 999px; }
  .btn.small { padding: 6px 12px; min-height: 32px; font-size: 12px; }
  .btn.solid { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .shape-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }

  .draw-bar {
    margin-bottom: 8px; padding: 6px 12px;
    background: #FFF3E9; border: 1px solid #F0D3B8; border-radius: 10px;
    font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex-shrink: 0;
  }
  .draw-bar[hidden] { display: none; }
  .draw-actions { display: flex; gap: 6px; }

  .board-area {
    flex: 1; min-height: 0; min-width: 0; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }
  #board { display: block; user-select: none; -webkit-user-select: none; }
  .tap { cursor: pointer; }

  .controls {
    margin-top: 8px; flex-shrink: 0;
    background: #fff; border: 1px solid #EBE4D6; border-radius: 12px; padding: 10px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .label { font-weight: 700; color: #6B6459; font-size: 13px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .btns .btn { flex: 1; min-width: 84px; font-size: 14px; white-space: nowrap; }

  .status {
    margin-top: 6px; flex-shrink: 0; padding: 8px 14px;
    background: #F0F5F2; border: 1px solid #D7E5DE; border-radius: 10px;
    font-size: 13px;
    font-size: clamp(12px, 1.6vh, 14px); font-weight: 600; color: #1F4B3F;
    text-align: center;
  }

  /* 화면 높이가 낮을 때(폰 가로 등): 제목을 숨기고 여백·버튼을 줄여 한 화면에 맞춤 */
  @media (max-height: 480px) {
    .title, .subtitle { display: none; }
    .btn { min-height: 30px; padding: 5px 10px; font-size: 12px; }
    .btn.pill { min-height: 30px; padding: 5px 12px; }
    .btn.small { min-height: 28px; padding: 4px 10px; }
    .shape-btns { margin-bottom: 4px; }
    .draw-bar { margin-bottom: 4px; padding: 4px 10px; }
    .controls { margin-top: 4px; padding: 6px 8px; }
    .status { margin-top: 4px; padding: 5px 10px; }
  }
  @media (max-width: 600px) and (orientation: portrait) {
    .btn { min-height: 32px; padding: 6px 8px; font-size: 12px; }
    .btns .btn { min-width: 0; font-size: 12px; }
    .controls .label { display: none; }
    .drawing-active .controls { display: none; }
  }
  @media (max-height: 620px) and (orientation: portrait) { .title { display: none; } }
  /* 폰 가로 모드: 조작 버튼을 오른쪽 열로 옮겨 판을 최대한 크게 */
  @media (max-height: 480px) and (orientation: landscape) {
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      column-gap: 8px;
    }
    .shape-btns { grid-column: 1 / span 2; grid-row: 1; }
    .draw-bar { grid-column: 1 / span 2; grid-row: 2; }
    .board-area { grid-column: 1; grid-row: 3; }
    .controls { grid-column: 2; grid-row: 3; margin-top: 0; align-self: center; flex-direction: column; align-items: stretch; }
    .controls .label { display: none; }
    .btns { flex-direction: column; }
    .status { grid-column: 1 / span 2; grid-row: 4; }
  }

  /* flex gap 미지원 브라우저(iOS 14.4 이하 등)용 여백 대체 */
  .no-flex-gap .shape-btns > *, .no-flex-gap .btns > *, .no-flex-gap .draw-actions > * { margin: 0 6px 6px 0; }
  .no-flex-gap .controls > * { margin-right: 8px; }
  .no-flex-gap .draw-bar > * { margin-right: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <h1 class="title">도형 뒤집기 시뮬레이션</h1>
    <p class="subtitle">도형을 고르거나 직접 그린 뒤, 위쪽·아래쪽·왼쪽·오른쪽으로 뒤집으면 어떻게 될지 예상하고 확인해 보세요.</p>

    <div class="shape-btns" id="shapeBtns"></div>

    <div class="draw-bar" id="drawBar" hidden>
      <span id="drawMsg"></span>
      <div class="draw-actions">
        <button class="btn small solid" id="finishBtn">도형 완성</button>
        <button class="btn small" id="clearBtn">다시 그리기</button>
      </div>
    </div>

    <div class="board-area" id="boardArea">
      <svg id="board"></svg>
    </div>

    <div class="controls">
      <span class="label">뒤집기</span>
      <div class="btns" id="dirBtns"></div>
      <button class="btn" id="resetBtn">초기화</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // flex gap 미지원 브라우저 감지 → 여백을 margin으로 대체
  (function () {
    var f = document.createElement('div');
    f.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    f.appendChild(document.createElement('div'));
    f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    var ok = f.scrollHeight === 1;
    document.body.removeChild(f);
    if (!ok) document.documentElement.className += ' no-flex-gap';
  })();

  // ---------- 판 설정 (교과서처럼 가운데 + 위·아래·왼쪽·오른쪽 4칸) ----------
  var N = 5;                 // 5 x 5 모눈 (활동지와 같음)
  var U = 44;                // 모눈 한 칸 (viewBox 단위)
  var B = N * U;             // 상자 한 변
  var G = 96;                // 상자 사이 간격 (점선 기준선과 화살표 자리)
  var P = 26;                // 바깥 여백 (이름표 자리)
  var VB = P * 2 + B * 3 + G * 2;
  var NS = 'http://www.w3.org/2000/svg';

  var BOX = {
    center: { c: 1, r: 1 },
    up:     { c: 1, r: 0 },
    down:   { c: 1, r: 2 },
    left:   { c: 0, r: 1 },
    right:  { c: 2, r: 1 }
  };
  function boxOrigin(key) {
    var b = BOX[key];
    return { x: P + b.c * (B + G), y: P + b.r * (B + G) };
  }
  var DIRS = [
    { key: 'up',    label: '↑ 위쪽',   name: '위쪽' },
    { key: 'down',  label: '↓ 아래쪽', name: '아래쪽' },
    { key: 'left',  label: '← 왼쪽',   name: '왼쪽' },
    { key: 'right', label: '→ 오른쪽', name: '오른쪽' }
  ];

  // ---------- 기본 도형 (5x5 모눈 좌표) ----------
  var PRESETS = {
    '깃발 모양': {
      head: false,
      parts: [
        { pts: [{ x: 1.4, y: 0.6 }, { x: 2.1, y: 0.6 }, { x: 2.1, y: 4.4 }, { x: 1.4, y: 4.4 }], fill: '#8FC14A', stroke: '#6E9A33' },
        { pts: [{ x: 2.1, y: 0.6 }, { x: 4.0, y: 1.7 }, { x: 2.1, y: 2.8 }], fill: '#E8517E', stroke: '#C23A63' }
      ]
    },
    '집 모양': {
      head: true,
      parts: [
        { pts: [{ x: 1.5, y: 4.5 }, { x: 3.5, y: 4.5 }, { x: 3.5, y: 2.5 }, { x: 1.5, y: 2.5 }], fill: '#FFD666', stroke: '#D9A32B' },
        { pts: [{ x: 1, y: 2.5 }, { x: 4, y: 2.5 }, { x: 3, y: 1 }, { x: 2, y: 1 }], fill: '#6FD8F5', stroke: '#2AA9CE' }
      ]
    },
    '삼각형': {
      head: true,
      parts: [
        { pts: [{ x: 1, y: 1 }, { x: 1, y: 4 }, { x: 4, y: 4 }], fill: '#DDEFC6', stroke: '#8BC34A' }
      ]
    }
  };
  var DRAW = '직접 그리기';
  var DEFAULT_STATUS = '어떻게 될지 먼저 예상한 뒤, 뒤집을 방향을 눌러 보세요.';

  // ---------- 상태 ----------
  var state = {
    shapeName: '깃발 모양',
    customPoints: [],
    drawingMode: false,
    flipped: { up: false, down: false, left: false, right: false },
    anim: null,               // { dir, t }
    status: DEFAULT_STATUS
  };
  var rafId = null;
  var animGroup = null;

  // ---------- DOM 참조 ----------
  var $ = function (id) { return document.getElementById(id); };
  var shapeBtns = $('shapeBtns'), drawBar = $('drawBar'), drawMsg = $('drawMsg');
  var finishBtn = $('finishBtn'), clearBtn = $('clearBtn');
  var boardArea = $('boardArea'), board = $('board');
  var dirBtns = $('dirBtns'), resetBtn = $('resetBtn'), statusEl = $('status');
  board.setAttribute('viewBox', '0 0 ' + VB + ' ' + VB);

  // ---------- 헬퍼 ----------
  function S(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function dirOf(key) { return DIRS.filter(function (d) { return d.key === key; })[0]; }
  function getShape() {
    if (state.shapeName === DRAW) {
      return { head: true, parts: [{ pts: state.customPoints, fill: '#F3C9AE', stroke: '#C1622D' }] };
    }
    return PRESETS[state.shapeName];
  }
  function hasShape() {
    if (state.shapeName !== DRAW) return true;
    return !state.drawingMode && state.customPoints.length >= 3;
  }
  // 상자 안 모눈 좌표 → 화면 좌표. mirror: 해당 방향으로 뒤집은 모양(상자 안에서 좌우/상하가 바뀜)
  function mapper(boxKey, mirror) {
    var o = boxOrigin(boxKey);
    return function (p) {
      var x = p.x, y = p.y;
      if (mirror === 'left' || mirror === 'right') x = N - x;
      if (mirror === 'up' || mirror === 'down') y = N - y;
      return { x: o.x + x * U, y: o.y + y * U };
    };
  }
  // 가운데 상자와 각 방향 상자 사이의 기준선
  function foldLine(dir) {
    var o = boxOrigin('center');
    if (dir === 'right') return { vertical: true, v: o.x + B + G / 2 };
    if (dir === 'left') return { vertical: true, v: o.x - G / 2 };
    if (dir === 'up') return { vertical: false, v: o.y - G / 2 };
    return { vertical: false, v: o.y + B + G / 2 };
  }
  function polyStr(pts, map) {
    return pts.map(function (p) { var q = map(p); return q.x + ',' + q.y; }).join(' ');
  }

  // ---------- 그리기 요소 ----------
  var THEME = {
    center: { frame: '#8E9BD6', fill: '#FFFFFF', pill: '#E3E7F7', text: '#3E4A86' },
    side:   { frame: '#A8C66C', fill: '#FFFFFF', pill: '#E2EEC9', text: '#3D5A1E' }
  };

  function drawBox(key, label) {
    var o = boxOrigin(key);
    var th = key === 'center' ? THEME.center : THEME.side;
    var g = S('g', {}, board);
    var hit = S('rect', { x: o.x - 6, y: o.y - 6, width: B + 12, height: B + 12, rx: 16, fill: th.fill, stroke: th.frame, 'stroke-width': 3 }, g);
    for (var i = 1; i < N; i++) {
      S('line', { x1: o.x + i * U, y1: o.y, x2: o.x + i * U, y2: o.y + B, stroke: '#E6E1D6', 'stroke-width': 1.2 }, g);
      S('line', { x1: o.x, y1: o.y + i * U, x2: o.x + B, y2: o.y + i * U, stroke: '#E6E1D6', 'stroke-width': 1.2 }, g);
    }
    S('rect', { x: o.x, y: o.y, width: B, height: B, fill: 'none', stroke: '#D5CFC2', 'stroke-width': 1.2 }, g);
    // 이름표
    var pw = label.length * 19 + 34, ph = 34;
    var px = o.x + B / 2 - pw / 2, py = o.y - 6 - ph / 2;
    S('rect', { x: px, y: py, width: pw, height: ph, rx: 17, fill: th.pill, stroke: th.frame, 'stroke-width': 2 }, g);
    var tx = S('text', { x: o.x + B / 2, y: py + ph / 2 + 7, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: th.text, 'font-family': 'inherit' }, g);
    tx.textContent = label;
    if (key !== 'center') {
      g.setAttribute('class', 'tap');
      g.addEventListener('click', function () { startFlip(key); });
    }
    return hit;
  }

  function drawFoldLine(dir) {
    var o = boxOrigin('center');
    var a = foldLine(dir);
    var active = state.anim && state.anim.dir === dir;
    var color = '#E8657A';
    var g = S('g', { opacity: active || state.flipped[dir] ? 1 : 0.75 }, board);
    var p1, p2;
    if (a.vertical) { p1 = { x: a.v, y: o.y }; p2 = { x: a.v, y: o.y + B }; }
    else { p1 = { x: o.x, y: a.v }; p2 = { x: o.x + B, y: a.v }; }
    S('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: '#555', 'stroke-width': 2, 'stroke-dasharray': '3 5', 'stroke-linecap': 'round' }, g);
    // 교과서처럼 기준선을 넘어가는 곡선 화살표
    var s, e, c, mid = a.vertical ? o.y + B / 2 : o.x + B / 2;
    var R = 24;
    if (dir === 'right') { s = { x: a.v - R, y: mid + 12 }; c = { x: a.v, y: mid - 52 }; e = { x: a.v + R, y: mid + 12 }; }
    else if (dir === 'left') { s = { x: a.v + R, y: mid + 12 }; c = { x: a.v, y: mid - 52 }; e = { x: a.v - R, y: mid + 12 }; }
    else if (dir === 'up') { s = { x: mid + 12, y: a.v + R }; c = { x: mid - 52, y: a.v }; e = { x: mid + 12, y: a.v - R }; }
    else { s = { x: mid + 12, y: a.v - R }; c = { x: mid - 52, y: a.v }; e = { x: mid + 12, y: a.v + R }; }
    var tx = e.x - c.x, ty = e.y - c.y, tl = Math.sqrt(tx * tx + ty * ty);
    var ux = tx / tl, uy = ty / tl, nx = -uy, ny = ux, hl = 12;
    var bx = e.x - ux * hl, by = e.y - uy * hl;
    S('path', { d: 'M ' + s.x + ' ' + s.y + ' Q ' + c.x + ' ' + c.y + ' ' + bx + ' ' + by, fill: 'none', stroke: color, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
    S('polygon', { points: e.x + ',' + e.y + ' ' + (bx + nx * 8) + ',' + (by + ny * 8) + ' ' + (bx - nx * 8) + ',' + (by - ny * 8), fill: color }, g);
    g.setAttribute('class', 'tap');
    g.addEventListener('click', function () { startFlip(dir); });
  }

  function drawShape(parent, shape, map) {
    var g = S('g', {}, parent);
    shape.parts.forEach(function (part) {
      if (part.pts.length < 2) return;
      S('polygon', { points: polyStr(part.pts, map), fill: part.fill, stroke: part.stroke, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
    });
    if (shape.head && shape.parts[0].pts.length) {
      var h = map(shape.parts[0].pts[0]);
      S('circle', { cx: h.x, cy: h.y, r: 7, fill: '#F2B84B', stroke: '#fff', 'stroke-width': 2 }, g);
    }
    return g;
  }

  // ---------- 렌더링 ----------
  function renderShapeButtons() {
    shapeBtns.textContent = '';
    Object.keys(PRESETS).forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'btn pill' + (state.shapeName === name ? ' on-green' : '');
      b.textContent = name;
      b.addEventListener('click', function () { selectShape(name); });
      shapeBtns.appendChild(b);
    });
    var d = document.createElement('button');
    d.className = 'btn pill' + (state.shapeName === DRAW ? ' on-orange' : '');
    d.textContent = '✏️ 직접 그리기';
    d.addEventListener('click', startDrawing);
    shapeBtns.appendChild(d);
  }

  function renderDrawBar() {
    var show = state.shapeName === DRAW;
    drawBar.hidden = !show;
    var root = document.documentElement;
    var cls = (' ' + root.className + ' ').replace(' drawing-active ', ' ');
    root.className = (cls + (show && state.drawingMode ? 'drawing-active' : '')).replace(/^\s+|\s+$/g, '');
    if (!show) return;
    var n = state.customPoints.length;
    drawMsg.textContent = state.drawingMode
      ? "가운데 '뒤집기 전' 모눈의 점을 차례로 눌러 도형을 그려 보세요. (점 " + n + '개)'
      : '도형이 완성되었어요. 뒤집을 방향을 눌러 보세요.';
    finishBtn.disabled = !(state.drawingMode && n >= 3);
  }

  function renderBoard() {
    board.textContent = '';
    animGroup = null;
    var centerRect = drawBox('center', '뒤집기 전');
    DIRS.forEach(function (d) { drawBox(d.key, d.name + '으로 뒤집기'); });
    DIRS.forEach(function (d) { drawFoldLine(d.key); });

    var shape = getShape();
    var drawable = state.shapeName === DRAW && state.drawingMode;
    if (hasShape() || drawable) drawShape(board, shape, mapper('center', null));
    if (state.shapeName === DRAW) {
      var m = mapper('center', null);
      state.customPoints.forEach(function (p) {
        var q = m(p);
        S('circle', { cx: q.x, cy: q.y, r: 6, fill: '#C1622D', stroke: '#fff', 'stroke-width': 2 }, board);
      });
    }
    if (drawable) {
      // 그리기 중에는 가운데 상자 위에 투명한 판을 깔아 점 누르기를 받음
      var o = boxOrigin('center');
      var catcher = S('rect', { x: o.x - U / 2, y: o.y - U / 2, width: B + U, height: B + U, fill: 'transparent', style: 'cursor:crosshair' }, board);
      catcher.addEventListener('click', handleDrawClick);
    }

    if (hasShape()) {
      DIRS.forEach(function (d) {
        if (state.flipped[d.key] && !(state.anim && state.anim.dir === d.key)) {
          drawShape(board, shape, mapper(d.key, d.key));
        }
      });
      if (state.anim) {
        animGroup = drawShape(board, shape, mapper('center', null));
        updateAnim();
      }
    }
    board.style.touchAction = drawable ? 'none' : 'manipulation';
  }

  // 기준선을 축으로 종이를 접듯이 넘어가는 애니메이션
  function updateAnim() {
    if (!animGroup || !state.anim) return;
    var a = foldLine(state.anim.dir);
    var s = Math.cos(Math.PI * state.anim.t);
    if (a.vertical) animGroup.setAttribute('transform', 'translate(' + a.v + ' 0) scale(' + s + ' 1) translate(' + (-a.v) + ' 0)');
    else animGroup.setAttribute('transform', 'translate(0 ' + a.v + ') scale(1 ' + s + ') translate(0 ' + (-a.v) + ')');
  }

  function renderControls() {
    Array.prototype.forEach.call(dirBtns.children, function (b, i) {
      var k = DIRS[i].key;
      b.className = 'btn' + (state.anim && state.anim.dir === k ? ' on-green' : state.flipped[k] ? ' done' : '');
      b.disabled = !hasShape() || !!state.anim;
    });
  }

  function renderStatus() { statusEl.textContent = state.status; }

  function render() {
    renderShapeButtons();
    renderDrawBar();
    renderBoard();
    renderControls();
    renderStatus();
    layoutBoard();
  }

  // ---------- 동작 ----------
  function handleDrawClick(e) {
    if (state.shapeName !== DRAW || !state.drawingMode) return;
    var rect = board.getBoundingClientRect();
    if (rect.width <= 0) return;
    var k = VB / rect.width;
    var vx = (e.clientX - rect.left) * k, vy = (e.clientY - rect.top) * k;
    var o = boxOrigin('center');
    var gx = Math.round((vx - o.x) / U), gy = Math.round((vy - o.y) / U);
    if (gx < 0 || gx > N || gy < 0 || gy > N) return;
    state.customPoints.push({ x: gx, y: gy });
    renderDrawBar();
    renderBoard();
    renderControls();
  }

  function startFlip(dir) {
    if (!hasShape() || state.anim) return;
    var d = dirOf(dir);
    state.anim = { dir: dir, t: 0 };
    state.status = d.name + '으로 뒤집는 중...';
    renderBoard(); renderControls(); renderStatus();
    var start = null, duration = 1000;
    function tick(now) {
      if (start === null) start = now;
      var t = Math.min(1, (now - start) / duration);
      state.anim.t = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      updateAnim();
      if (t < 1) { rafId = requestAnimationFrame(tick); return; }
      state.anim = null;
      state.flipped[dir] = true;
      var all = DIRS.every(function (x) { return state.flipped[x.key]; });
      state.status = all
        ? '네 방향으로 모두 뒤집었어요! 위쪽과 아래쪽, 왼쪽과 오른쪽으로 뒤집은 모양을 비교해 보세요.'
        : d.name + '으로 뒤집었어요. 모양과 방향은 어떻게 되었나요?';
      renderBoard(); renderControls(); renderStatus();
    }
    rafId = requestAnimationFrame(tick);
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    state.anim = null;
    state.flipped = { up: false, down: false, left: false, right: false };
    state.status = DEFAULT_STATUS;
  }
  function selectShape(name) {
    reset();
    state.shapeName = name;
    state.drawingMode = false;
    render();
  }
  function startDrawing() {
    reset();
    state.shapeName = DRAW;
    state.customPoints = [];
    state.drawingMode = true;
    render();
  }
  function finishDrawing() {
    if (state.customPoints.length >= 3) {
      state.drawingMode = false;
      render();
    }
  }
  function clearDrawing() {
    reset();
    state.customPoints = [];
    state.drawingMode = true;
    render();
  }

  // ---------- 화면 크기에 맞춰 판 크기 계산 (아이폰 주소창 변화 대응) ----------
  function layoutBoard() {
    var side = Math.floor(Math.max(120, Math.min(boardArea.clientWidth, boardArea.clientHeight)));
    board.setAttribute('width', side);
    board.setAttribute('height', side);
  }

  // ---------- 초기화 ----------
  DIRS.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.addEventListener('click', function () { startFlip(d.key); });
    dirBtns.appendChild(b);
  });
  finishBtn.addEventListener('click', finishDrawing);
  clearBtn.addEventListener('click', clearDrawing);
  resetBtn.addEventListener('click', function () { reset(); render(); });

  window.addEventListener('resize', layoutBoard);
  window.addEventListener('orientationchange', layoutBoard);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutBoard);
  if (window.ResizeObserver) new ResizeObserver(layoutBoard).observe(boardArea);

  render();
})();

</script>
</body>
</html>
